[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aave"
version = "0.9.0"
description = "Local-first archival validation and evidence-provenance toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RobGonWin and AAVE contributors" }]
dependencies = [
  "ged4py>=0.5",
  "PyYAML>=6.0",
]

[project.scripts]
aave = "aave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
